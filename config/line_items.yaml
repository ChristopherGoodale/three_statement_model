  template: '{CF_NET_INCOME} + {CF_AMORTIZATION_OF_FINANCE_LEASE_RIGHT_OF_USE_ASSETS_AND_DEPREC} + {CF_STOCK_BASED_COMPENSATION}
    + {CF_AMORTIZATION_OF_SOFTWARE_AND_INTANGIBLE_ASSETS} + {CF_AMORTIZATION_OF_DEBT_RELATED_COSTS} -
    {CF_LOSS_ON_EXTINGUISHMENT_OF_DEBT} - {CF_GAIN_LOSS_ON_SALE_OF_EQUIPMENT} + {CF_DEFERRED_INCOME_TAXES}
    + {CF_OTHER} - {CF_RECEIVABLES} - {CF_INVENTORY} - {CF_INCOME_TAX_RECEIVABLE} - {CF_PREPAID_EXPENSES_AND_OTHER_ASSETS}
    + {CF_ACCOUNTS_PAYABLE} + {CF_INCOME_TAX_PAYABLE} + {CF_ACCRUED_EXPENSES_AND_OTHER_LIABILITIES}'
